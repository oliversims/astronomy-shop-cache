---
# ============================================================
# ServiceAccount — opentelemetry-demo
#
# Kubernetes identity for every demo pod. A ServiceAccount is
# how a pod authenticates to the API server (and, if annotated,
# to AWS via IRSA). This file only names the account and labels
# it — there are no IRSA/eks.amazonaws.com annotations here.
#
# Deployments set serviceAccountName: opentelemetry-demo so
# they all share this one identity.
#
# It works together with:
#   */deploy.yaml → spec.template.spec.serviceAccountName
# ============================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opentelemetry-demo
  labels:
    opentelemetry.io/name: opentelemetry-demo
    app.kubernetes.io/instance: opentelemetry-demo
    app.kubernetes.io/name: opentelemetry-demo
    app.kubernetes.io/version: "1.12.0"
    app.kubernetes.io/part-of: opentelemetry-demo
