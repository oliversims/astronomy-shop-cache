---
# ============================================================
# Deployment — Payment Service
#
# Charges cards at checkout in the OpenTelemetry demo shop.
# FLAGD can inject failures (paymentServiceFailure /
# paymentServiceUnreachable) so you can watch broken traces.
#
# It works together with:
#   svc.yaml → ClusterIP other pods call on port 8080
#   kubernetes/serviceaccount.yaml → shared ServiceAccount
#   kubernetes/checkout/deploy.yaml → caller (PAYMENT_SERVICE_ADDR)
#   kubernetes/flagd → feature flags that can fail charges
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentelemetry-demo-paymentservice
  labels:
    opentelemetry.io/name: opentelemetry-demo-paymentservice
    app.kubernetes.io/instance: opentelemetry-demo
    app.kubernetes.io/component: paymentservice
    app.kubernetes.io/name: opentelemetry-demo-paymentservice
    app.kubernetes.io/version: "1.12.0"
    app.kubernetes.io/part-of: opentelemetry-demo
spec:

  # ------------------------------------------------------------
  # REPLICAS
  # One replica — demo default.
  # ------------------------------------------------------------
  replicas: 1

  # ------------------------------------------------------------
  # REVISION HISTORY
  # Keep up to 10 old ReplicaSets so you can roll back a deploy.
  # ------------------------------------------------------------
  revisionHistoryLimit: 10

  # ------------------------------------------------------------
  # SELECTOR
  # Must match the pod template labels below so this Deployment
  # owns the right pods. The Service uses the same label.
  # ------------------------------------------------------------
  selector:
    matchLabels:
      opentelemetry.io/name: opentelemetry-demo-paymentservice
  template:
    metadata:
      labels:
        opentelemetry.io/name: opentelemetry-demo-paymentservice
        app.kubernetes.io/instance: opentelemetry-demo
        app.kubernetes.io/component: paymentservice
        app.kubernetes.io/name: opentelemetry-demo-paymentservice
    spec:

      # ------------------------------------------------------------
      # SERVICE ACCOUNT
      # Shared identity for demo pods. Defined in
      # kubernetes/serviceaccount.yaml (name: opentelemetry-demo).
      # ------------------------------------------------------------
      serviceAccountName: opentelemetry-demo
      containers:
        - name: paymentservice

          # ----------------------------------------------------------
          # IMAGE
          # Official OpenTelemetry demo image for this service.
          # IfNotPresent: reuse the image if the node already has it;
          # only pull from ghcr.io when it is missing.
          # ----------------------------------------------------------
          image: 'ghcr.io/oliversims/otel-demo:1.12.0-paymentservice'
          imagePullPolicy: IfNotPresent

          # ----------------------------------------------------------
          # PORTS
          # Process listens on 8080 (named "service"). The ClusterIP
          # in svc.yaml forwards to this containerPort.
          # ----------------------------------------------------------
          ports:
            - containerPort: 8080
              name: service

          # ----------------------------------------------------------
          # ENVIRONMENT
          # PAYMENT_SERVICE_PORT is the listen port (8080).
          # FLAGD_HOST/PORT talk to opentelemetry-demo-flagd:8013 so
          # flags can fail charge requests.
          # OTEL_* sends traces and metrics to the demo collector
          # opentelemetry-demo-otelcol (OpenTelemetry Collector) on 4317 (OTLP gRPC).
          # fieldRef sets OTEL_SERVICE_NAME from the pod label
          # app.kubernetes.io/component → "paymentservice".
          # ----------------------------------------------------------
          env:
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.labels['app.kubernetes.io/component']
            - name: OTEL_COLLECTOR_NAME
              value: 'opentelemetry-demo-otelcol'
            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: cumulative
            - name: PAYMENT_SERVICE_PORT
              value: "8080"
            - name: FLAGD_HOST
              value: 'opentelemetry-demo-flagd'
            - name: FLAGD_PORT
              value: "8013"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://$(OTEL_COLLECTOR_NAME):4317
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.name=$(OTEL_SERVICE_NAME),service.namespace=opentelemetry-demo,service.version=1.12.0

          # ----------------------------------------------------------
          # RESOURCES
          # Memory cap only — 120Mi. No CPU request or limit is set.
          # ----------------------------------------------------------
          resources:
            limits:
              memory: 120Mi

          # ----------------------------------------------------------
          # SECURITY CONTEXT
          # Run as UID/GID 1000, non-root.
          # ----------------------------------------------------------
          securityContext:
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000

          # ----------------------------------------------------------
          # VOLUME MOUNTS
          # Unused Helm leftover — this container mounts nothing.
          # ----------------------------------------------------------
          volumeMounts:

      # ------------------------------------------------------------
      # VOLUMES
      # Unused Helm leftover — no volumes are defined.
      # ------------------------------------------------------------
      volumes:
