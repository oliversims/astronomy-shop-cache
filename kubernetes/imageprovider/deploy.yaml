---
# ============================================================
# Deployment — Image Provider
#
# Serves product images for the OpenTelemetry demo shop.
# frontendproxy fetches images from this service on port 8081.
#
# It works together with:
#   svc.yaml → ClusterIP other pods call on port 8081
#   kubernetes/serviceaccount.yaml → shared ServiceAccount
#   kubernetes/frontendproxy/deploy.yaml → IMAGE_PROVIDER_HOST/PORT
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentelemetry-demo-imageprovider
  labels:
    opentelemetry.io/name: opentelemetry-demo-imageprovider
    app.kubernetes.io/instance: opentelemetry-demo
    app.kubernetes.io/component: imageprovider
    app.kubernetes.io/name: opentelemetry-demo-imageprovider
    app.kubernetes.io/version: "1.12.0"
    app.kubernetes.io/part-of: opentelemetry-demo
spec:

  # ------------------------------------------------------------
  # REPLICAS
  # One replica — demo default.
  # ------------------------------------------------------------
  replicas: 1

  # ------------------------------------------------------------
  # REVISION HISTORY
  # Keep up to 10 old ReplicaSets so you can roll back a deploy.
  # ------------------------------------------------------------
  revisionHistoryLimit: 10

  # ------------------------------------------------------------
  # SELECTOR
  # Must match the pod template labels below so this Deployment
  # owns the right pods. The Service uses the same label.
  # ------------------------------------------------------------
  selector:
    matchLabels:
      opentelemetry.io/name: opentelemetry-demo-imageprovider
  template:
    metadata:
      labels:
        opentelemetry.io/name: opentelemetry-demo-imageprovider
        app.kubernetes.io/instance: opentelemetry-demo
        app.kubernetes.io/component: imageprovider
        app.kubernetes.io/name: opentelemetry-demo-imageprovider
    spec:

      # ------------------------------------------------------------
      # SERVICE ACCOUNT
      # Shared identity for demo pods. Defined in
      # kubernetes/serviceaccount.yaml (name: opentelemetry-demo).
      # ------------------------------------------------------------
      serviceAccountName: opentelemetry-demo
      containers:
        - name: imageprovider

          # ----------------------------------------------------------
          # IMAGE
          # Official OpenTelemetry demo image for this service.
          # IfNotPresent: reuse the image if the node already has it;
          # only pull from ghcr.io when it is missing.
          # ----------------------------------------------------------
          image: 'ghcr.io/oliversims/otel-demo:1.12.0-imageprovider'
          imagePullPolicy: IfNotPresent

          # ----------------------------------------------------------
          # PORTS
          # Process listens on 8081 (named "service"). The ClusterIP
          # in svc.yaml forwards to this containerPort.
          # ----------------------------------------------------------
          ports:
            - containerPort: 8081
              name: service

          # ----------------------------------------------------------
          # ENVIRONMENT
          # IMAGE_PROVIDER_PORT is the listen port (8081).
          # OTEL_COLLECTOR_PORT_GRPC 4317 / OTEL_COLLECTOR_HOST send
          # telemetry to opentelemetry-demo-otelcol (OpenTelemetry Collector) (OTLP gRPC).
          # fieldRef sets OTEL_SERVICE_NAME from the pod label
          # app.kubernetes.io/component → "imageprovider".
          # ----------------------------------------------------------
          env:
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.labels['app.kubernetes.io/component']
            - name: OTEL_COLLECTOR_NAME
              value: 'opentelemetry-demo-otelcol'
            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: cumulative
            - name: IMAGE_PROVIDER_PORT
              value: "8081"
            - name: OTEL_COLLECTOR_PORT_GRPC
              value: "4317"
            - name: OTEL_COLLECTOR_HOST
              value: $(OTEL_COLLECTOR_NAME)
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.name=$(OTEL_SERVICE_NAME),service.namespace=opentelemetry-demo,service.version=1.12.0

          # ----------------------------------------------------------
          # RESOURCES
          # Memory cap only — 50Mi. No CPU request or limit is set.
          # ----------------------------------------------------------
          resources:
            limits:
              memory: 50Mi

          # ----------------------------------------------------------
          # VOLUME MOUNTS
          # Unused Helm leftover — this container mounts nothing.
          # ----------------------------------------------------------
          volumeMounts:

      # ------------------------------------------------------------
      # VOLUMES
      # Unused Helm leftover — no volumes are defined.
      # ------------------------------------------------------------
      volumes:
