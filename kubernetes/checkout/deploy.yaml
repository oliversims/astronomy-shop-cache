---
# ============================================================
# Deployment — Checkout Service
#
# Orchestrates placing an order in the OpenTelemetry demo shop.
# It calls other ClusterIPs for cart, currency, email, payment,
# product catalog, and shipping, then publishes to Kafka. Feature
# flags come from flagd. An initContainer waits for Kafka before
# the app starts.
#
# It works together with:
#   svc.yaml → ClusterIP the frontend calls on port 8080
#   kubernetes/cart, currency, email, payment, productcatalog,
#     shipping → downstream ClusterIPs listed in env below
#   kubernetes/kafka → order events (waited on by initContainer)
#   kubernetes/flagd → feature-flag server this pod queries
#   kubernetes/serviceaccount.yaml → shared ServiceAccount
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentelemetry-demo-checkoutservice
  labels:
    opentelemetry.io/name: opentelemetry-demo-checkoutservice
    app.kubernetes.io/instance: opentelemetry-demo
    app.kubernetes.io/component: checkoutservice
    app.kubernetes.io/name: opentelemetry-demo-checkoutservice
    app.kubernetes.io/version: "1.12.0"
    app.kubernetes.io/part-of: opentelemetry-demo
spec:

  # ------------------------------------------------------------
  # REPLICAS
  # One replica — demo default. This project does not define an
  # HPA, so the count stays at 1 unless you change it here.
  # ------------------------------------------------------------
  replicas: 1

  # ------------------------------------------------------------
  # REVISION HISTORY
  # Keep up to 10 old ReplicaSets so you can roll back a deploy.
  # ------------------------------------------------------------
  revisionHistoryLimit: 10

  # ------------------------------------------------------------
  # SELECTOR
  # Must match the pod template labels below so this Deployment
  # owns the right pods. The Service uses the same label.
  # ------------------------------------------------------------
  selector:
    matchLabels:
      opentelemetry.io/name: opentelemetry-demo-checkoutservice
  template:
    metadata:
      labels:
        opentelemetry.io/name: opentelemetry-demo-checkoutservice
        app.kubernetes.io/instance: opentelemetry-demo
        app.kubernetes.io/component: checkoutservice
        app.kubernetes.io/name: opentelemetry-demo-checkoutservice
    spec:

      # ------------------------------------------------------------
      # SERVICE ACCOUNT
      # Shared identity for demo pods. Defined in
      # kubernetes/serviceaccount.yaml (name: opentelemetry-demo).
      # ------------------------------------------------------------
      serviceAccountName: opentelemetry-demo
      containers:
        - name: checkoutservice

          # ----------------------------------------------------------
          # IMAGE
          # Official OpenTelemetry demo image for this service.
          # IfNotPresent: reuse the image if the node already has it;
          # only pull from ghcr.io when it is missing.
          # ----------------------------------------------------------
          image: 'ghcr.io/oliversims/otel-demo:1.12.0-checkoutservice'
          imagePullPolicy: IfNotPresent

          # ----------------------------------------------------------
          # PORTS
          # Process listens on 8080 (named "service"). The ClusterIP
          # in svc.yaml forwards to this containerPort.
          # ----------------------------------------------------------
          ports:
            - containerPort: 8080
              name: service

          # ----------------------------------------------------------
          # ENVIRONMENT
          # OTEL_* sends traces and metrics to the demo collector
          # opentelemetry-demo-otelcol (OpenTelemetry Collector). fieldRef sets
          # OTEL_SERVICE_NAME from the pod label
          # app.kubernetes.io/component → "checkoutservice".
          # Port 4317 is OTLP gRPC.
          # *_SERVICE_ADDR values are in-cluster ClusterIP DNS names
          # (email uses an http:// URL; the others are host:port).
          # KAFKA_SERVICE_ADDR is the demo Kafka broker.
          # FLAGD_* points at the demo feature-flag server.
          # ----------------------------------------------------------
          env:
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.labels['app.kubernetes.io/component']
            - name: OTEL_COLLECTOR_NAME
              value: 'opentelemetry-demo-otelcol'
            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: cumulative
            - name: CHECKOUT_SERVICE_PORT
              value: "8080"
            - name: CART_SERVICE_ADDR
              value: 'opentelemetry-demo-cartservice:8080'
            - name: CURRENCY_SERVICE_ADDR
              value: 'opentelemetry-demo-currencyservice:8080'
            - name: EMAIL_SERVICE_ADDR
              value: http://opentelemetry-demo-emailservice:8080
            - name: PAYMENT_SERVICE_ADDR
              value: 'opentelemetry-demo-paymentservice:8080'
            - name: PRODUCT_CATALOG_SERVICE_ADDR
              value: 'opentelemetry-demo-productcatalogservice:8080'
            - name: SHIPPING_SERVICE_ADDR
              value: 'opentelemetry-demo-shippingservice:8080'
            - name: KAFKA_SERVICE_ADDR
              value: 'opentelemetry-demo-kafka:9092'
            - name: FLAGD_HOST
              value: 'opentelemetry-demo-flagd'
            - name: FLAGD_PORT
              value: "8013"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://$(OTEL_COLLECTOR_NAME):4317
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.name=$(OTEL_SERVICE_NAME),service.namespace=opentelemetry-demo,service.version=1.12.0

          # ----------------------------------------------------------
          # RESOURCES
          # Memory cap only — 20Mi. No CPU request or limit is set.
          # ----------------------------------------------------------
          resources:
            limits:
              memory: 20Mi

          # ----------------------------------------------------------
          # VOLUME MOUNTS
          # Unused Helm leftover — this container mounts nothing.
          # ----------------------------------------------------------
          volumeMounts:

      # ------------------------------------------------------------
      # INIT CONTAINER
      # wait-for-kafka: busybox loops with nc until Kafka accepts
      # TCP on opentelemetry-demo-kafka:9092. The checkout container
      # does not start until this succeeds.
      # ------------------------------------------------------------
      initContainers:
        - command:
          - sh
          - -c
          - until nc -z -v -w30 opentelemetry-demo-kafka 9092; do echo waiting
            for kafka; sleep 2; done;
          image: 'ghcr.io/oliversims/busybox:1.36'
          name: wait-for-kafka

      # ------------------------------------------------------------
      # VOLUMES
      # Unused Helm leftover — no volumes are defined.
      # ------------------------------------------------------------
      volumes:
