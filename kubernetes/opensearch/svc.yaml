---
# ============================================================
# Service — OpenSearch
#
# ClusterIP for the log cabinet. otelcol sends logs here on
# HTTP :9200. ClusterIP is in-cluster only — not an AWS
# load balancer and not a public hostname.
#
# It works together with:
#   opensearch/deploy.yaml → OpenSearch pods
#   otelcol/cm.yaml        → logs exporter
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: opentelemetry-demo-opensearch
  labels:
    opentelemetry.io/name: opentelemetry-demo-opensearch
    app.kubernetes.io/instance: opentelemetry-demo
    app.kubernetes.io/component: opensearch
    app.kubernetes.io/name: opentelemetry-demo-opensearch
    app.kubernetes.io/version: "1.12.0"
    app.kubernetes.io/part-of: opentelemetry-demo
spec:

  # ------------------------------------------------------------
  # TYPE: ClusterIP
  # One DNS name, one port. Not an AWS load balancer.
  # ------------------------------------------------------------
  type: ClusterIP
  ports:
    - port: 9200
      name: http
      targetPort: 9200
  selector:
    opentelemetry.io/name: opentelemetry-demo-opensearch
