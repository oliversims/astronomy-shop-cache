---
# ============================================================
# Deployment — Load Generator
#
# Locust traffic generator for the OpenTelemetry demo shop.
# It drives synthetic shopper traffic at the frontend proxy
# (http://opentelemetry-demo-frontendproxy:8080). Locust's
# web UI listens on 8089 and is reached via frontendproxy.
#
# It works together with:
#   svc.yaml → ClusterIP for the Locust UI on port 8089
#   kubernetes/serviceaccount.yaml → shared ServiceAccount
#   kubernetes/frontendproxy/deploy.yaml → traffic target + UI path
#   kubernetes/flagd → feature flags (FLAGD_HOST / FLAGD_PORT)
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentelemetry-demo-loadgenerator
  labels:
    opentelemetry.io/name: opentelemetry-demo-loadgenerator
    app.kubernetes.io/instance: opentelemetry-demo
    app.kubernetes.io/component: loadgenerator
    app.kubernetes.io/name: opentelemetry-demo-loadgenerator
    app.kubernetes.io/version: "1.12.0"
    app.kubernetes.io/part-of: opentelemetry-demo
spec:

  # ------------------------------------------------------------
  # REPLICAS
  # One replica — demo default. A single Locust process.
  # ------------------------------------------------------------
  replicas: 1

  # ------------------------------------------------------------
  # REVISION HISTORY
  # Keep up to 10 old ReplicaSets so you can roll back a deploy.
  # ------------------------------------------------------------
  revisionHistoryLimit: 10

  # ------------------------------------------------------------
  # SELECTOR
  # Must match the pod template labels below so this Deployment
  # owns the right pods. The Service uses the same label.
  # ------------------------------------------------------------
  selector:
    matchLabels:
      opentelemetry.io/name: opentelemetry-demo-loadgenerator
  template:
    metadata:
      labels:
        opentelemetry.io/name: opentelemetry-demo-loadgenerator
        app.kubernetes.io/instance: opentelemetry-demo
        app.kubernetes.io/component: loadgenerator
        app.kubernetes.io/name: opentelemetry-demo-loadgenerator
    spec:

      # ------------------------------------------------------------
      # SERVICE ACCOUNT
      # Shared identity for demo pods. Defined in
      # kubernetes/serviceaccount.yaml (name: opentelemetry-demo).
      # ------------------------------------------------------------
      serviceAccountName: opentelemetry-demo
      containers:
        - name: loadgenerator

          # ----------------------------------------------------------
          # IMAGE
          # Official OpenTelemetry demo Locust image.
          # IfNotPresent: reuse the image if the node already has it;
          # only pull from ghcr.io when it is missing.
          # ----------------------------------------------------------
          image: 'ghcr.io/oliversims/otel-demo:1.12.0-loadgenerator'
          imagePullPolicy: IfNotPresent

          # ----------------------------------------------------------
          # PORTS
          # Locust web UI on 8089 (named "service"). The ClusterIP
          # in svc.yaml forwards to this containerPort; frontendproxy
          # exposes that UI to the browser.
          # ----------------------------------------------------------
          ports:
            - containerPort: 8089
              name: service

          # ----------------------------------------------------------
          # ENVIRONMENT
          # Locust: 10 users, spawn 1/s, UI on 8089, not headless,
          # autostart, browser traffic enabled. Target is the
          # frontend proxy on 8080.
          # PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python uses the
          # pure-Python protobuf runtime.
          # FLAGD_HOST/PORT talk to opentelemetry-demo-flagd:8013.
          # OTEL_* sends traces/metrics to the collector on 4317
          # (OTLP gRPC). fieldRef sets OTEL_SERVICE_NAME from the
          # pod label app.kubernetes.io/component → "loadgenerator".
          # ----------------------------------------------------------
          env:
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.labels['app.kubernetes.io/component']
            - name: OTEL_COLLECTOR_NAME
              value: 'opentelemetry-demo-otelcol'
            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: cumulative
            - name: LOCUST_WEB_PORT
              value: "8089"
            - name: LOCUST_USERS
              value: "10"
            - name: LOCUST_SPAWN_RATE
              value: "1"
            - name: LOCUST_HOST
              value: http://opentelemetry-demo-frontendproxy:8080
            - name: LOCUST_HEADLESS
              value: "false"
            - name: LOCUST_AUTOSTART
              value: "true"
            - name: LOCUST_BROWSER_TRAFFIC_ENABLED
              value: "true"
            - name: PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION
              value: python
            - name: FLAGD_HOST
              value: 'opentelemetry-demo-flagd'
            - name: FLAGD_PORT
              value: "8013"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://$(OTEL_COLLECTOR_NAME):4317
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.name=$(OTEL_SERVICE_NAME),service.namespace=opentelemetry-demo,service.version=1.12.0

          # ----------------------------------------------------------
          # RESOURCES
          # Memory cap only — 1500Mi (Locust + browser traffic).
          # No CPU request or limit is set.
          # ----------------------------------------------------------
          resources:
            limits:
              memory: 1500Mi

          # ----------------------------------------------------------
          # VOLUME MOUNTS
          # Unused Helm leftover — this container mounts nothing.
          # ----------------------------------------------------------
          volumeMounts:

      # ------------------------------------------------------------
      # VOLUMES
      # Unused Helm leftover — no volumes are defined.
      # ------------------------------------------------------------
      volumes:
