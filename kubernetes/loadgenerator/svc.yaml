---
# ============================================================
# Service — Load Generator
#
# ClusterIP for the Locust web UI on port 8089. frontendproxy
# reaches this Service to expose the UI; it is not an AWS
# load balancer.
#
# It works together with:
#   deploy.yaml → Locust pods selected by opentelemetry.io/name
#   kubernetes/frontendproxy/deploy.yaml → LOCUST_WEB_HOST/PORT
# ============================================================

apiVersion: v1
kind: Service
metadata:
  name: opentelemetry-demo-loadgenerator
  labels:
    opentelemetry.io/name: opentelemetry-demo-loadgenerator
    app.kubernetes.io/instance: opentelemetry-demo
    app.kubernetes.io/component: loadgenerator
    app.kubernetes.io/name: opentelemetry-demo-loadgenerator
    app.kubernetes.io/version: "1.12.0"
    app.kubernetes.io/part-of: opentelemetry-demo
spec:

  # ------------------------------------------------------------
  # TYPE
  # ClusterIP — reachable only inside the cluster. This is not
  # a LoadBalancer and does not create an AWS NLB/ALB.
  # ------------------------------------------------------------
  type: ClusterIP

  # ------------------------------------------------------------
  # PORTS
  # 8089 — Locust web UI. frontendproxy proxies this port.
  # ------------------------------------------------------------
  ports:
    - port: 8089
      name: tcp-service
      targetPort: 8089

  # ------------------------------------------------------------
  # SELECTOR
  # Routes traffic to pods with this label (the loadgenerator
  # Deployment).
  # ------------------------------------------------------------
  selector:
    opentelemetry.io/name: opentelemetry-demo-loadgenerator
