---
# ============================================================
# Deployment — Kafka
#
# Message bus for the OpenTelemetry demo shop. Checkout
# publishes order events here; accounting and fraud-detection
# consume them. This is a Deployment (not a StatefulSet) with
# 1 replica and no PersistentVolume — demo only. Broker data
# is lost if the pod restarts.
#
# It works together with:
#   svc.yaml → ClusterIP on 9092 (plaintext) and 9093 (controller)
#   kubernetes/serviceaccount.yaml → shared ServiceAccount
#   kubernetes/checkout/deploy.yaml → publishes orders
#   kubernetes/accounting/deploy.yaml → consumes orders
#   kubernetes/frauddetection/deploy.yaml → consumes orders
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentelemetry-demo-kafka
  labels:
    opentelemetry.io/name: opentelemetry-demo-kafka
    app.kubernetes.io/instance: opentelemetry-demo
    app.kubernetes.io/component: kafka
    app.kubernetes.io/name: opentelemetry-demo-kafka
    app.kubernetes.io/version: "1.12.0"
    app.kubernetes.io/part-of: opentelemetry-demo
spec:

  # ------------------------------------------------------------
  # REPLICAS
  # One replica — demo default. A single Kafka process, not a
  # clustered broker set.
  # ------------------------------------------------------------
  replicas: 1

  # ------------------------------------------------------------
  # REVISION HISTORY
  # Keep up to 10 old ReplicaSets so you can roll back a deploy.
  # ------------------------------------------------------------
  revisionHistoryLimit: 10

  # ------------------------------------------------------------
  # SELECTOR
  # Must match the pod template labels below so this Deployment
  # owns the right pods. The Service uses the same label.
  # ------------------------------------------------------------
  selector:
    matchLabels:
      opentelemetry.io/name: opentelemetry-demo-kafka
  template:
    metadata:
      labels:
        opentelemetry.io/name: opentelemetry-demo-kafka
        app.kubernetes.io/instance: opentelemetry-demo
        app.kubernetes.io/component: kafka
        app.kubernetes.io/name: opentelemetry-demo-kafka
    spec:

      # ------------------------------------------------------------
      # SERVICE ACCOUNT
      # Shared identity for demo pods. Defined in
      # kubernetes/serviceaccount.yaml (name: opentelemetry-demo).
      # ------------------------------------------------------------
      serviceAccountName: opentelemetry-demo
      containers:
        - name: kafka

          # ----------------------------------------------------------
          # IMAGE
          # Official OpenTelemetry demo Kafka image.
          # IfNotPresent: reuse the image if the node already has it;
          # only pull from ghcr.io when it is missing.
          # ----------------------------------------------------------
          image: 'ghcr.io/oliversims/otel-demo:1.12.0-kafka'
          imagePullPolicy: IfNotPresent

          # ----------------------------------------------------------
          # PORTS
          # 9092 plaintext — clients (checkout, accounting, fraud).
          # 9093 controller — Kafka KRaft controller listener.
          # svc.yaml forwards both ports to these containerPorts.
          # ----------------------------------------------------------
          ports:
            - containerPort: 9092
              name: plaintext
            - containerPort: 9093
              name: controller

          # ----------------------------------------------------------
          # ENVIRONMENT
          # KAFKA_ADVERTISED_LISTENERS must match the Service DNS
          # name (opentelemetry-demo-kafka:9092) so clients can
          # reconnect after the initial bootstrap.
          # KAFKA_HEAP_OPTS caps the JVM heap at 400M.
          # OTEL_* sends telemetry to opentelemetry-demo-otelcol (OpenTelemetry Collector).
          # fieldRef sets OTEL_SERVICE_NAME from the pod label
          # app.kubernetes.io/component → "kafka".
          # Port 4318 is OTLP HTTP (not gRPC 4317).
          # ----------------------------------------------------------
          env:
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.labels['app.kubernetes.io/component']
            - name: OTEL_COLLECTOR_NAME
              value: 'opentelemetry-demo-otelcol'
            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: cumulative
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://opentelemetry-demo-kafka:9092
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://$(OTEL_COLLECTOR_NAME):4318
            - name: KAFKA_HEAP_OPTS
              value: -Xmx400M -Xms400M
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.name=$(OTEL_SERVICE_NAME),service.namespace=opentelemetry-demo,service.version=1.12.0

          # ----------------------------------------------------------
          # RESOURCES
          # Memory cap only — 600Mi (heap is 400M; the rest is
          # off-heap / OS). No CPU request or limit is set.
          # ----------------------------------------------------------
          resources:
            limits:
              memory: 600Mi

          # ----------------------------------------------------------
          # SECURITY CONTEXT
          # Run as UID/GID 1000, non-root.
          # ----------------------------------------------------------
          securityContext:
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000

          # ----------------------------------------------------------
          # VOLUME MOUNTS
          # Unused Helm leftover — this container mounts nothing.
          # No PersistentVolume; broker data does not survive restarts.
          # ----------------------------------------------------------
          volumeMounts:

      # ------------------------------------------------------------
      # VOLUMES
      # Unused Helm leftover — no volumes are defined.
      # ------------------------------------------------------------
      volumes:
