---
# ============================================================
# Deployment — Accounting Service
#
# Kafka consumer in the OpenTelemetry demo shop. After checkout
# publishes an order event, this pod reads it from Kafka and
# "accounts" for the sale. It is not an HTTP API — there is no
# Service in this folder and the container declares no ports.
#
# It works together with:
#   kafka/svc.yaml        → ClusterIP opentelemetry-demo-kafka:9092
#   otelcol (OpenTelemetry Collector)               → traces/metrics over OTLP HTTP :4318
#   serviceaccount.yaml   → shared identity opentelemetry-demo
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentelemetry-demo-accountingservice
  labels:
    opentelemetry.io/name: opentelemetry-demo-accountingservice
    app.kubernetes.io/instance: opentelemetry-demo
    app.kubernetes.io/component: accountingservice
    app.kubernetes.io/name: opentelemetry-demo-accountingservice
    app.kubernetes.io/version: "1.12.0"
    app.kubernetes.io/part-of: opentelemetry-demo
spec:

  # ------------------------------------------------------------
  # REPLICAS
  # Demo default: a single consumer pod. There is no HPA in
  # this project — replica count stays at 1 unless you edit it.
  # ------------------------------------------------------------
  replicas: 1

  # ------------------------------------------------------------
  # REVISION HISTORY
  # Keep the last 10 ReplicaSets so you can roll back a bad
  # image or config change with kubectl rollout undo.
  # ------------------------------------------------------------
  revisionHistoryLimit: 10

  # ------------------------------------------------------------
  # SELECTOR
  # The Deployment owns pods whose labels match this selector.
  # Must match the pod template labels below.
  # ------------------------------------------------------------
  selector:
    matchLabels:
      opentelemetry.io/name: opentelemetry-demo-accountingservice
  template:
    metadata:
      labels:
        opentelemetry.io/name: opentelemetry-demo-accountingservice
        app.kubernetes.io/instance: opentelemetry-demo
        app.kubernetes.io/component: accountingservice
        app.kubernetes.io/name: opentelemetry-demo-accountingservice
    spec:

      # ------------------------------------------------------------
      # SERVICE ACCOUNT
      # Shared identity for demo pods. Defined in
      # kubernetes/serviceaccount.yaml (name: opentelemetry-demo).
      # ------------------------------------------------------------
      serviceAccountName: opentelemetry-demo
      containers:
        - name: accountingservice
          image: 'ghcr.io/oliversims/otel-demo:1.12.0-accountingservice'

          # ----------------------------------------------------
          # IMAGE PULL POLICY: IfNotPresent
          # Pull from GHCR only if this node does not already
          # have the image. Speeds up restarts on warm nodes.
          # ----------------------------------------------------
          imagePullPolicy: IfNotPresent

          # ----------------------------------------------------
          # ENVIRONMENT
          # No HTTP listen address — this process only consumes
          # Kafka and exports telemetry.
          # ----------------------------------------------------
          env:
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  # Reads the component label at runtime so the
                  # reported service name is "accountingservice".
                  fieldPath: metadata.labels['app.kubernetes.io/component']
            - name: OTEL_COLLECTOR_NAME
              value: 'opentelemetry-demo-otelcol'
            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: cumulative
            - name: KAFKA_SERVICE_ADDR
              # In-cluster Kafka ClusterIP, not a public broker.
              value: 'opentelemetry-demo-kafka:9092'
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              # OTLP HTTP (4318), not gRPC 4317.
              # $(OTEL_COLLECTOR_NAME) is Kubernetes env substitution.
              value: http://$(OTEL_COLLECTOR_NAME):4318
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.name=$(OTEL_SERVICE_NAME),service.namespace=opentelemetry-demo,service.version=1.12.0
          resources:
            limits:
              # Hard memory cap. Exceeding this OOMKills the container.
              memory: 120Mi

          # Unused Helm leftover — this consumer mounts no volumes.
          volumeMounts:

      # ----------------------------------------------------------
      # INIT CONTAINER — wait-for-kafka
      # Runs to completion before accountingservice starts.
      # Loops with nc until Kafka accepts TCP on 9092 so the
      # consumer does not crash on a race at cluster boot.
      # ----------------------------------------------------------
      initContainers:
        - command:
          - sh
          - -c
          - until nc -z -v -w30 opentelemetry-demo-kafka 9092; do echo waiting
            for kafka; sleep 2; done;
          image: 'ghcr.io/oliversims/busybox:1.36'
          name: wait-for-kafka

      # Unused Helm leftover — no volumes are defined for this pod.
      volumes:
