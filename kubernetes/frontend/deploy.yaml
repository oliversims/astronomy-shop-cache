---
# ============================================================
# Deployment — Frontend (Next.js shop UI)
#
# The demo shop's web UI. It calls other shop ClusterIPs
# (ads, cart, checkout, currency, catalog, recommendations,
# shipping) and reads feature flags from flagd. Internet users
# do NOT hit this pod's Service directly — they go through
# Ingress → frontendproxy (Envoy) → this ClusterIP.
#
# It works together with:
#   frontend/svc.yaml         → ClusterIP :8080 (proxy only)
#   frontendproxy/deploy.yaml → Envoy reverse proxy
#   frontendproxy/ingress.yaml → public AWS ALB path
#   flagd/svc.yaml            → feature flags on :8013
#   ad, cart, checkout, currency, productcatalog,
#   recommendation, shipping svc.yaml → backend ClusterIPs
#   otelcol (OpenTelemetry Collector)                   → server traces over OTLP gRPC :4317
#   serviceaccount.yaml       → shared identity opentelemetry-demo
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentelemetry-demo-frontend
  labels:
    opentelemetry.io/name: opentelemetry-demo-frontend
    app.kubernetes.io/instance: opentelemetry-demo
    app.kubernetes.io/component: frontend
    app.kubernetes.io/name: opentelemetry-demo-frontend
    app.kubernetes.io/version: "1.12.0"
    app.kubernetes.io/part-of: opentelemetry-demo
spec:

  # ------------------------------------------------------------
  # REPLICAS
  # Demo default: one UI pod. No HPA in this project.
  # ------------------------------------------------------------
  replicas: 1

  # ------------------------------------------------------------
  # REVISION HISTORY
  # Keep 10 old ReplicaSets for kubectl rollout undo.
  # ------------------------------------------------------------
  revisionHistoryLimit: 10

  # ------------------------------------------------------------
  # SELECTOR
  # Owns pods with this label. Must match the template labels.
  # ------------------------------------------------------------
  selector:
    matchLabels:
      opentelemetry.io/name: opentelemetry-demo-frontend
  template:
    metadata:
      labels:
        opentelemetry.io/name: opentelemetry-demo-frontend
        app.kubernetes.io/instance: opentelemetry-demo
        app.kubernetes.io/component: frontend
        app.kubernetes.io/name: opentelemetry-demo-frontend
    spec:

      # ------------------------------------------------------------
      # SERVICE ACCOUNT
      # Shared identity for demo pods. Defined in
      # kubernetes/serviceaccount.yaml (name: opentelemetry-demo).
      # ------------------------------------------------------------
      serviceAccountName: opentelemetry-demo
      containers:
        - name: frontend
          image: 'ghcr.io/oliversims/otel-demo:1.12.0-frontend'

          # ----------------------------------------------------
          # IMAGE PULL POLICY: IfNotPresent
          # Pull only if the node does not already have the image.
          # ----------------------------------------------------
          imagePullPolicy: IfNotPresent
          ports:

            - containerPort: 8080
              name: service
          env:
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  # Runtime service name = "frontend" (server-side).
                  fieldPath: metadata.labels['app.kubernetes.io/component']
            - name: OTEL_COLLECTOR_NAME
              value: 'opentelemetry-demo-otelcol'
            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: cumulative
            - name: FRONTEND_PORT
              value: "8080"
            - name: FRONTEND_ADDR
              value: :8080

            # ----------------------------------------------------
            # BACKEND ADDRESSES
            # In-cluster ClusterIP DNS names. These are not AWS
            # load balancers — only other pods can reach them.
            # ----------------------------------------------------
            - name: AD_SERVICE_ADDR
              value: 'opentelemetry-demo-adservice:8080'
            - name: CART_SERVICE_ADDR
              value: 'opentelemetry-demo-cartservice:8080'
            - name: CHECKOUT_SERVICE_ADDR
              value: 'opentelemetry-demo-checkoutservice:8080'
            - name: CURRENCY_SERVICE_ADDR
              value: 'opentelemetry-demo-currencyservice:8080'
            - name: PRODUCT_CATALOG_SERVICE_ADDR
              value: 'opentelemetry-demo-productcatalogservice:8080'
            - name: RECOMMENDATION_SERVICE_ADDR
              value: 'opentelemetry-demo-recommendationservice:8080'
            - name: SHIPPING_SERVICE_ADDR
              value: 'opentelemetry-demo-shippingservice:8080'
            - name: FLAGD_HOST
              value: 'opentelemetry-demo-flagd'
            - name: FLAGD_PORT
              value: "8013"
            - name: OTEL_COLLECTOR_HOST
              value: $(OTEL_COLLECTOR_NAME)
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              # Server-side OTLP gRPC (4317), not HTTP 4318.
              value: http://$(OTEL_COLLECTOR_NAME):4317
            - name: WEB_OTEL_SERVICE_NAME
              # Name used for traces that originate in the browser.
              value: frontend-web
            - name: PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              # Browser cannot reach otelcol (OpenTelemetry Collector) inside the cluster.
              # The page sends traces to localhost:8080; Envoy
              # (frontendproxy) forwards /otlp-http to the collector.
              value: http://localhost:8080/otlp-http/v1/traces
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.name=$(OTEL_SERVICE_NAME),service.namespace=opentelemetry-demo,service.version=1.12.0
          resources:
            limits:
              memory: 250Mi

          # ----------------------------------------------------
          # CONTAINER SECURITY CONTEXT
          # Run as UID/GID 1001, never as root. This is the
          # Next.js image's non-root user — not an IRSA mapping.
          # ----------------------------------------------------
          securityContext:
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1001

          # Unused Helm leftover — this UI mounts no volumes.
          volumeMounts:

      # Unused Helm leftover — no volumes are defined for this pod.
      volumes:
