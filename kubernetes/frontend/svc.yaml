---
# ============================================================
# Service — Frontend
#
# ClusterIP in front of the Next.js UI pods. Only reachable
# from inside the cluster. Browsers on the internet do not
# call this Service — frontendproxy (and Ingress) do.
#
# It works together with:
#   frontend/deploy.yaml      → pods selected by the label below
#   frontendproxy/deploy.yaml → Envoy upstream FRONTEND_HOST
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: opentelemetry-demo-frontend
  labels:
    opentelemetry.io/name: opentelemetry-demo-frontend
    app.kubernetes.io/instance: opentelemetry-demo
    app.kubernetes.io/component: frontend
    app.kubernetes.io/name: opentelemetry-demo-frontend
    app.kubernetes.io/version: "1.12.0"
    app.kubernetes.io/part-of: opentelemetry-demo
spec:

  # ------------------------------------------------------------
  # TYPE: ClusterIP
  # Stable in-cluster virtual IP + DNS. Not an AWS load balancer.
  # ------------------------------------------------------------
  type: ClusterIP
  ports:
    - port: 8080
      name: tcp-service
      targetPort: 8080
  selector:
    # Must match the frontend pod template label.
    opentelemetry.io/name: opentelemetry-demo-frontend
