---
# ============================================================
# Service — Product Catalog Service
#
# ClusterIP for product list/details. Other pods reach it as
# opentelemetry-demo-productcatalogservice on port 8080.
# ClusterIP is in-cluster only — not an AWS load balancer.
#
# It works together with:
#   deploy.yaml → catalog pods selected by opentelemetry.io/name
#   kubernetes/frontend/deploy.yaml → PRODUCT_CATALOG_SERVICE_ADDR
#   kubernetes/checkout/deploy.yaml → PRODUCT_CATALOG_SERVICE_ADDR
# ============================================================

apiVersion: v1
kind: Service
metadata:
  name: opentelemetry-demo-productcatalogservice
  labels:
    opentelemetry.io/name: opentelemetry-demo-productcatalogservice
    app.kubernetes.io/instance: opentelemetry-demo
    app.kubernetes.io/component: productcatalogservice
    app.kubernetes.io/name: opentelemetry-demo-productcatalogservice
    app.kubernetes.io/version: "1.12.0"
    app.kubernetes.io/part-of: opentelemetry-demo
spec:

  # ------------------------------------------------------------
  # TYPE
  # ClusterIP — reachable only inside the cluster. This is not
  # a LoadBalancer and does not create an AWS NLB/ALB.
  # ------------------------------------------------------------
  type: ClusterIP

  # ------------------------------------------------------------
  # PORTS
  # 8080 → targetPort 8080 (PRODUCT_CATALOG_SERVICE_PORT).
  # ------------------------------------------------------------
  ports:
    - port: 8080
      name: tcp-service
      targetPort: 8080

  # ------------------------------------------------------------
  # SELECTOR
  # Routes traffic to pods with this label (the productcatalog
  # Deployment).
  # ------------------------------------------------------------
  selector:
    opentelemetry.io/name: opentelemetry-demo-productcatalogservice
